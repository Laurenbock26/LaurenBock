<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .site-navigation {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
        }

        .site-navigation a {
            text-decoration: none;
            color: black;
            font-size: 16px;
        }

        .site-navigation a:hover {
            text-decoration: underline;
        }

        main {
            padding: 100px 40px 40px 220px;
        }

        footer {
            padding: 20px;
        }
    </style>
</head>

<body>

    <main>
        <section>
            <h1>Welcome to My Website</h1>

            <p>
                This is my personal website. Explore the different sections
                to learn more about me.
            </p>
        </section>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
