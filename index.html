<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Personal Website</title>

    <style>

        /* -------------------- */
        /* Basic Page Styling   */
        /* -------------------- */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            color: #333;
        }


        /* -------------------- */
        /* Navigation Bar       */
        /* -------------------- */

        .navigation {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 70px;

            display: flex;
            align-items: center;

            /* Spreads the navigation across the top */
            justify-content: space-between;

            padding: 0 50px;

            background-color: white;

            border-bottom: 1px solid #ddd;

            box-sizing: border-box;

            z-index: 9999;
        }


        /* Navigation Links */

        .navigation a {
            color: #333;

            text-decoration: none;

            font-size: 16px;

            font-weight: 500;

            padding: 10px 15px;

            transition: 0.3s;
        }


        /* Navigation Hover Effect */

        .navigation a:hover {
            color: #777;

            text-decoration: underline;
        }


        /* -------------------- */
        /* Main Home Page       */
        /* -------------------- */

        main {
            padding-top: 70px;
        }


        /* Home Section */

        .home {
            min-height: calc(100vh - 70px);

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 40px;
        }


        /* Main Heading */

        .home h1 {
            font-size: 48px;

            margin-bottom: 20px;
        }


        /* Introduction */

        .home p {
            font-size: 20px;

            max-width: 600px;

            line-height: 1.6;
        }


        /* -------------------- */
        /* Footer               */
        /* -------------------- */

        footer {
            text-align: center;

            padding: 20px;

            border-top: 1px solid #ddd;
        }

    </style>
</head>


<body>

    <!-- Navigation is added here automatically by JavaScript -->


    <!-- Main Content -->

    <main>

        <section class="home">

            <h1>Welcome to My Website</h1>

            <p>
                This is my personal website. Explore the different sections
                to learn more about me.
            </p>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>© 2026 My Personal Website</p>

    </footer>


    <!-- JavaScript File -->

    <script src="script.js"></script>

</body>

</html>
