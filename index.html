<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Personal Website</title>

    <style>

        /* =========================
           GENERAL PAGE STYLING
        ========================= */

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #333333;
        }


        /* =========================
           NAVIGATION BAR
        ========================= */

        .navigation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 50px;

            background-color: #ffffff;

            border-bottom: 1px solid #dddddd;

            box-sizing: border-box;

            z-index: 1000;
        }


        /* Navigation Links */

        .navigation a {
            color: #333333;
            text-decoration: none;

            font-size: 16px;
            font-weight: 500;

            padding: 10px 20px;

            transition: 0.3s;
        }


        /* Navigation Hover */

        .navigation a:hover {
            color: #777777;
            text-decoration: underline;
        }


        /* =========================
           HOME PAGE
        ========================= */

        main {
            padding-top: 75px;
        }


        .home {
            min-height: calc(100vh - 75px);

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 40px;
            box-sizing: border-box;
        }


        /* Main Introduction */

        .home h1 {
            font-size: 52px;
            margin: 0 0 15px 0;
        }


        .home h2 {
            font-size: 24px;
            font-weight: normal;

            margin: 0 0 20px 0;
        }


        .home p {
            font-size: 18px;

            max-width: 600px;

            line-height: 1.6;

            margin: 0;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 25px;

            border-top: 1px solid #dddddd;

            font-size: 14px;
        }

    </style>

</head>


<body>


    <!-- =========================
         JAVASCRIPT NAVIGATION
    ========================= -->

    <script>

        // Create the navigation bar
        const navigation = document.createElement("nav");

        // Give the navigation its class
        navigation.className = "navigation";

        // Create the four navigation categories
        navigation.innerHTML = `

            <a href="index.html">About Me</a>

            <a href="education.html">Education</a>

            <a href="experience.html">Professional Experience</a>

            <a href="involvement.html">Involvement</a>

        `;

        // Add the navigation bar to the website
        document.body.appendChild(navigation);

    </script>


    <!-- =========================
         HOME PAGE CONTENT
    ========================= -->

    <main>

        <section class="home">

            <h1>Hi, I'm Lauren! 👋</h1>

            <h2>Welcome to my personal website.</h2>

            <p>
                Marketing student, traveler, and creative thinker.
                Get to know me, my experiences, and what inspires me!
            </p>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <p>© 2026 My Personal Website</p>

    </footer>


</body>

</html>
